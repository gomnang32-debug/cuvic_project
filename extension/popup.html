<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="theme.js"></script>
<title>BUILD 대학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles/common.css">
<style>
  body { width: 380px; background: var(--card); }
  .wrap { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
  .icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 8px; background: none; border: 0; cursor: pointer; }
  .icon-btn:hover { background: var(--soft); color: var(--ink); }
  .band { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 6px; transition: background .2s; }
  .band-top { display: flex; align-items: center; justify-content: space-between; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .mode { display: flex; align-items: center; gap: 8px; height: 40px; background: none; border: 0; font-size: 13px; color: var(--ink2); cursor: pointer; padding: 0; }
  .lbl { font-size: 12px; color: var(--muted); }
  .timer { font-family: var(--mono); font-weight: 700; font-size: 46px; line-height: 1; letter-spacing: -.02em; }
  .timer small { font-size: 24px; color: var(--muted); }
  .sub { font-size: 12px; color: var(--ink2); }
  .combo { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .combo .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .combo .bar i { display: block; height: 4px; background: var(--ink); }
  .combo span { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  section { padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
  .tabbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .tabrow { display: flex; gap: 10px; align-items: flex-start; }
  .fav { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; background: var(--soft); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--ink2); overflow: hidden; }
  .fav img { width: 16px; height: 16px; }
  .ttl { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .verdict { font-size: 12px; font-weight: 600; padding: 6px 8px; border-radius: 6px; }
  .actions { display: flex; gap: 6px; }
  .actions .btn { flex: 1; height: 40px; font-size: 13px; }
  .grid { padding: 0 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
  a.mini:hover { border-color: var(--line2); background: var(--hover); }
  .big { font-family: var(--mono); font-weight: 700; font-size: 30px; line-height: 1.15; }
  .pbar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .pbar i { display: block; height: 6px; background: var(--blue); }
  footer { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; border-top: 1px solid var(--line); margin-top: 12px; }
  footer a { font-size: 14px; font-weight: 500; height: 44px; display: flex; align-items: center; }
  .welcome { padding: 28px 20px; display: flex; flex-direction: column; gap: 12px; }
  .welcome h1 { font-size: 22px; margin: 0; line-height: 1.35; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <a class="logo" href="#" id="home"><b>BUILD</b><span id="schoolName">대학교</span></a>
    <div style="display:flex;align-items:center"><button class="theme-btn" data-theme-toggle aria-label="라이트/다크 모드 전환" title="라이트/다크 모드"><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button class="icon-btn" id="settings" aria-label="설정">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button></div>
  </header>
  <div id="main"></div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>

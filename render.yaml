# Render 배포 설정 — Render 대시보드에서 New → Blueprint 로 이 저장소를 고르면 자동으로 읽어요.
services:
  - type: web
    name: build-univ
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Seoul    # 코드는 한국 시간을 직접 계산하지만, 로그 시각도 한국 시간으로
      - key: TRUST_PROXY
        value: "1"           # Render 프록시 뒤라서 실제 접속 IP는 x-forwarded-for 에 있음 (가입 횟수 제한용)
      - key: MIN_ACCOUNT_AGE_HOURS
        value: "0"           # 대회 시연: 가입 즉시 학교 점수 반영. 실제 운영 때는 24 로
      - key: DEMO
        value: "1"           # 0 으로 바꾸면 데모 학교 없이 실사용자만
      - key: ADMIN_KEY
        generateValue: true  # /admin?key=… 로 학교 등록 요청 관리
      # 유료 디스크를 붙였다면: DATA_DIR = /var/data
